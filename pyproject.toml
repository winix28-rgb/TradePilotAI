[project]
name = "tradepilotai-os"
version = "2.0.0"
description = "TradePilotAI Operating System"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Wilhelm", email = "your.email@example.com" }
]

dependencies = [
    "python-dotenv>=1.1.1",
]

[project.scripts]
tradepilotai-os = "tradepilotai_os.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradepilotai_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "mypy>=1.18.0",
]